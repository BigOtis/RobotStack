<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Skip the Hosted Platform Tax</title>
  <desc id="desc">Deploy directly to GCP and MongoDB to avoid paying double for an app-builder subscription.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.4"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .title { fill: #0f172a; font-weight: 700; font-size: 28px; letter-spacing: -0.5px; }
      .subtitle { fill: #64748b; font-weight: 400; font-size: 16px; }
      
      .card { fill: #ffffff; stroke-width: 1.5px; }
      .card-red { stroke: #fca5a5; }
      .card-green { stroke: #86efac; }
      
      .col-title-red { fill: #b91c1c; font-weight: 700; font-size: 20px; }
      .col-title-green { fill: #047857; font-weight: 700; font-size: 20px; }
      
      .list-item { fill: #475569; font-weight: 500; font-size: 14px; }
      .list-icon-red { fill: #ef4444; }
      .list-icon-green { fill: #10b981; }
      
      .coin { animation: float 3s ease-in-out infinite; }
      .check { animation: pop 3s ease-in-out infinite; transform-origin: center; }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pop {
        0%, 100% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="24" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="24" fill="url(#dots)"/>

  <!-- Header -->
  <text x="48" y="60" class="title">Skip the Hosted Platform Tax</text>
  <text x="48" y="88" class="subtitle">Deploy directly to GCP and MongoDB to avoid paying double for an app-builder subscription.</text>

  <!-- Left Column: The App-Builder Path -->
  <g transform="translate(48, 130)">
    <rect width="420" height="180" rx="16" class="card card-red" filter="url(#shadow)"/>
    
    <!-- Title -->
    <rect x="24" y="24" width="32" height="32" rx="8" fill="#fef2f2"/>
    <path d="M34 40l12 -12M34 28l12 12" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <text x="68" y="46" class="col-title-red">The App-Builder Path</text>
    
    <!-- List -->
    <g transform="translate(24, 80)">
      <circle cx="6" cy="-5" r="4" class="list-icon-red"/>
      <text x="20" y="0" class="list-item">Pay for your AI agent subscription</text>
      
      <circle cx="6" cy="25" r="4" class="list-icon-red"/>
      <text x="20" y="30" class="list-item">Pay for hosted app-builder platform</text>
      
      <circle cx="6" cy="55" r="4" class="list-icon-red"/>
      <text x="20" y="60" class="list-item">Locked into proprietary infrastructure</text>
    </g>
    
    <!-- Visual: Rising Costs -->
    <g transform="translate(320, 140)">
      <rect x="0" y="-40" width="16" height="40" fill="#f87171" rx="4">
        <animate attributeName="height" values="40; 50; 40" dur="4s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-40; -50; -40" dur="4s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="-60" width="16" height="60" fill="#f87171" rx="4">
        <animate attributeName="height" values="60; 75; 60" dur="4s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-60; -75; -60" dur="4s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="48" y="-80" width="16" height="80" fill="#f87171" rx="4">
        <animate attributeName="height" values="80; 100; 80" dur="4s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-80; -100; -80" dur="4s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="56" cy="-110" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2" class="coin"/>
      <text x="56" y="-105" text-anchor="middle" fill="#ef4444" font-weight="700" font-size="16" class="coin">$</text>
    </g>
  </g>

  <!-- Right Column: The Robot Future Path -->
  <g transform="translate(492, 130)">
    <rect width="420" height="180" rx="16" class="card card-green" filter="url(#shadow)"/>
    
    <!-- Title -->
    <rect x="24" y="24" width="32" height="32" rx="8" fill="#f0fdf4"/>
    <path d="M30 40l6 6 12 -12" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="68" y="46" class="col-title-green">The Robot Future Path</text>
    
    <!-- List -->
    <g transform="translate(24, 80)">
      <circle cx="6" cy="-5" r="4" class="list-icon-green"/>
      <text x="20" y="0" class="list-item">Agent operates the repo directly</text>
      
      <circle cx="6" cy="25" r="4" class="list-icon-green"/>
      <text x="20" y="30" class="list-item">Cloud Run scales to zero (Free)</text>
      
      <circle cx="6" cy="55" r="4" class="list-icon-green"/>
      <text x="20" y="60" class="list-item">You own the GCP &amp; DB accounts</text>
    </g>
    
    <!-- Visual: Falling Costs / Checkmark -->
    <g transform="translate(320, 140)">
      <rect x="0" y="-80" width="16" height="80" fill="#34d399" rx="4">
        <animate attributeName="height" values="80; 60; 80" dur="4s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-80; -60; -80" dur="4s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="-50" width="16" height="50" fill="#34d399" rx="4">
        <animate attributeName="height" values="50; 35; 50" dur="4s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-50; -35; -50" dur="4s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="48" y="-30" width="16" height="30" fill="#34d399" rx="4">
        <animate attributeName="height" values="30; 20; 30" dur="4s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-30; -20; -30" dur="4s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      
      <g class="check" transform="translate(56, -60)">
        <circle cx="0" cy="0" r="16" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
        <path d="M-5 0l4 4 8 -8" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>
</svg>